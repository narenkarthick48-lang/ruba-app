<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruba — Beyond Chat</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="stars"></div>

  <!-- LOGIN -->
  <section id="loginScreen" class="screen">
    <div class="orb"></div>

    <div class="login-card">
      <div class="logo">R</div>
      <h1>Ruba</h1>
      <p>Conversations beyond ordinary.</p>

      <button id="googleLogin" class="google-btn">
        <span>G</span>
        Continue with Google
      </button>

      <small>
        Secure authentication powered by Google
      </small>
    </div>
  </section>

  <!-- APP -->
  <section id="appScreen" class="app hidden">

    <header class="topbar">
      <div>
        <div class="brand">Ruba<span>●</span></div>
        <small id="status">Your space</small>
      </div>

      <div class="profile">
        <img id="userPhoto" src="" alt="profile">
        <button id="logout">↪</button>
      </div>
    </header>

    <main>

      <div class="welcome">
        <p class="tiny">WELCOME TO YOUR SPACE</p>
        <h2 id="welcomeText">Hello 👋</h2>
        <p>Who do you want to talk to?</p>
      </div>

      <div class="search">
        🔎
        <input id="searchBox" placeholder="Find a conversation...">
      </div>

      <div class="rooms">

        <div class="room">
          <div class="avatar a1">✦</div>
          <div>
            <b>Open Space</b>
            <p>Start something new</p>
          </div>
          <span>›</span>
        </div>

        <div class="room">
          <div class="avatar a2">∞</div>
          <div>
            <b>Private Space</b>
            <p>Your conversations</p>
          </div>
          <span>›</span>
        </div>

        <div class="room">
          <div class="avatar a3">◉</div>
          <div>
            <b>Discover</b>
            <p>Find people to connect</p>
          </div>
          <span>›</span>
        </div>

      </div>

    </main>

    <nav class="bottom-nav">
      <button class="active">⌂<small>Space</small></button>
      <button>◌<small>Chats</small></button>
      <button>＋<small>New</small></button>
      <button>◎<small>Profile</small></button>
    </nav>

  </section>

  <script type="module" src="app.js"></script>

</body>
    </html>
